<ion-content>
    <h2 class="section-title">Minhas Doses Hoje</h2>
    <div class="header-section">
        <div class="progress-container">
            <div class="progress-ring" [style.--progress]="progresso * 360 + 'deg'">
                <div class="inner-ring">
                    <span class="doses">{{dosesTomadas}} / {{totalDoses}}</span>
                    <span class="label">Tomadas</span>
                </div>
            </div>
        </div>
    </div>

    <div class="content-section">
        <h2 class="section-title">Terapias em andamento</h2>

        <div class="doses-list">
            <div class="dose-card" *ngFor="let t of tratamentos" [class.completed]="t.concluido"
                (click)="abrirDetalhes(t.id)">
                <div class="icon-box">
                    <ion-icon name="medkit"></ion-icon>
                </div>
                <div class="info-box">
                    <h3>{{t.medicamento}}</h3>
                    <p class="time">
                        <ion-icon name="time"></ion-icon>
                        {{t.frequencia}}
                    </p>
                </div>
                <div class="action-box">
                    <div class="check-btn" (click)="concluirTratamento($event, t)" [class.checked]="t.concluido">
                        <ion-icon name="checkmark" *ngIf="t.concluido"></ion-icon>
                    </div>
                </div>
            </div>

            <div *ngIf="tratamentos.length === 0" class="empty-state ion-text-center ion-padding">
                <p>Nenhum tratamento cadastrado.</p>
                <ion-button routerLink="/">Adicionar Medicamento</ion-button>
            </div>
        </div>
    </div>
</ion-content>
